<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vostok Quartermaster</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside>
  <div class="brand"><b>Vostok</b><span>Quartermaster</span></div>
  <nav id="nav">
    <button data-page="snapshots" class="on">Snapshots</button>
    <button data-page="repair">Repair</button>
    <button disabled>Inventory <i>Soon</i></button>
    <button disabled>Character <i>Soon</i></button>
    <button disabled>World <i>Soon</i></button>
    <button disabled>Traders <i>Soon</i></button>
    <button disabled>Mods <i>Soon</i></button>
    <button data-page="settings">Settings</button>
  </nav>
  <p class="note">Unofficial tool. Not affiliated with the developer of Road to Vostok.</p>
</aside>
<main id="view"></main>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <form method="dialog">
    <h3 id="dt"></h3><p id="dx"></p>
    <input id="di" type="text" maxlength="60" autocomplete="off">
    <div class="row"><button id="dok" value="ok" class="pri">OK</button><button value="cancel">Cancel</button></div>
  </form>
</dialog>
<script src="tres.js"></script>
<script src="app.js"></script>
</body>
</html>
